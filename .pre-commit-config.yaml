# Run `pre-commit install && pre-commit install --hook-type commit-msg` after cloning.
# Requires Ruby with the bundle installed, and Node (for jscpd) on PATH.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: rubocop
        name: rubocop (lint + format)
        entry: bundle exec rubocop --autocorrect
        language: system
        types: [ruby]
        pass_filenames: false
      - id: steep
        name: steep (type check)
        entry: bundle exec steep check
        language: system
        types: [ruby]
        pass_filenames: false

  # Language-agnostic DRY gate — identical config in every mailkube repo.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (copy-paste detector)
        entry: npx --yes jscpd@4 --config .jscpd.json .
        language: system
        pass_filenames: false

  # Enforce Conventional Commits on the commit message (matches the org house style).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
